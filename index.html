<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#070B0F" />
    <script>
      // Applique le thème avant le premier affichage (évite le flash clair/sombre).
      // Sombre par défaut (identité « console SOC ») ; le choix du visiteur est mémorisé.
      ;(function () {
        var t = null
        try {
          t = localStorage.getItem('theme')
        } catch (e) {}
        document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark'
      })()
    </script>
    <noscript>
      <style>
        [style*='opacity:0'],
        [style*='opacity: 0'] {
          opacity: 1 !important;
          transform: none !important;
        }
      </style>
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
